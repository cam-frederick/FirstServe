name: FirstServe
options:
  bundleIdPrefix: com.Cam
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.2"
  defaultConfig: Debug
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_TEAM: QTX695U3Q9

targets:
  FirstServe:
    type: application
    platform: iOS
    sources:
      - path: FirstServe
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_GENERATION_MODE: GeneratedFile
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        PRODUCT_BUNDLE_IDENTIFIER: com.Cam.FirstServe
        PRODUCT_NAME: FirstServe
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"FirstServe/Preview Content\""
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"

  FirstServeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FirstServeTests
        excludes:
          - "**/.DS_Store"
      - path: FirstServe/Models
        excludes:
          - "**/.DS_Store"
      - path: FirstServe/ViewModels
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: FirstServe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Cam.FirstServeTests
        PRODUCT_NAME: FirstServeTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  FirstServe:
    build:
      targets:
        FirstServe: all
        FirstServeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FirstServeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
