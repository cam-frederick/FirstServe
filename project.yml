name: FirstServe
options:
  bundleIdPrefix: com.firstserve
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.2"
  defaultConfig: Debug
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_TEAM: ""

targets:
  FirstServe:
    type: application
    platform: iOS
    sources:
      - path: FirstServe
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_GENERATION_MODE: GeneratedFile
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        PRODUCT_BUNDLE_IDENTIFIER: com.firstserve.app
        PRODUCT_NAME: FirstServe
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"FirstServe/Preview Content\""
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  FirstServeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FirstServeTests
    dependencies:
      - target: FirstServe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.firstserve.tests

  FirstServeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FirstServeUITests
    dependencies:
      - target: FirstServe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.firstserve.uitests

schemes:
  FirstServe:
    build:
      targets:
        FirstServe: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FirstServeTests
        - FirstServeUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
